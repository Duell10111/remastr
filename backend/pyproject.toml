[project]
name = "remastr"
version = "0.1.0"
description = "AI upscaling for Plex recordings: download, compare test clips, batch-process, upload back to Plex. Web UI + MCP."
readme = "README.md"
authors = [
    { name = "Duell10111", email = "duell10111@t-online.de" }
]
requires-python = ">=3.13"
dependencies = [
    "fastapi>=0.162.0",
    "mcp>=2.3.0",
    "plexapi>=4.18.3",
    "pydantic-settings>=2.16.1",
    "uvicorn[standard]>=0.54.0",
]

[project.scripts]
remastr = "remastr.main:run"

[build-system]
requires = ["uv_build>=0.13.5,<0.14.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "httpx>=0.28.1",
    "pytest>=9.1.1",
    "pytest-asyncio>=1.4.0",
    "ruff>=0.17.2",
]

[tool.ruff]
line-length = 120
target-version = "py313"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
